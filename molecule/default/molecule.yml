---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
    environment:
      BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: 'yes'
    cgroupns_mode: host
    privileged: true
provisioner:
  name: ansible
  log: true
  inventory:
    host_vars:
      instance:
        ansible_user: ansible
        ansible_remote_tmp: /tmp/.ansible-ansible/tmp
verifier:
  name: ansible
