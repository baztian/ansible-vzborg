---
- name: Converge
  hosts: all
  become: true
  vars:
    vzborg_test_repo: /tmp/molecule-vzborg-repo
    vzborg_configs:
      local: |
        VZBORG_REPO="{{ vzborg_test_repo }}"
        VZBORG_PASSPHRASE="molecule-test-passphrase"
        ENCRYPTION_MODE=none

  tasks:
    - name: Create VzBorg config directory
      ansible.builtin.file:
        path: /etc/vzborg
        state: directory
        mode: '0700'
    - name: 'Run role'  # noqa role-name[path]
      ansible.builtin.include_role:
        name: >-
          ../../../{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') |
          basename }}
    - name: Include this role again to verify idempotence
      ansible.builtin.include_role:  # noqa role-name[path]
        name: >-
          ../../../{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') |
          basename }}
